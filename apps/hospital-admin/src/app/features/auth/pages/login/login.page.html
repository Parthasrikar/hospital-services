<div class="login-page min-h-screen flex items-center justify-center p-4">
  <div class="login-card w-full max-w-md p-8 corner-radius-16">
    <!-- Header with Design System Icon -->
    <div class="flex flex-col items-center justify-center gap-2 mb-6">
      <div class="icon-badge p-3 corner-radius-12 flex items-center justify-center">
        <ui-icon name="user.svg" size="xlarge" color="var(--stag-text-brand)"></ui-icon>
      </div>
      <h1 class="heading-md font-bold mt-2">Hospital Admin Portal</h1>
      <p class="body-sm text-secondary">Sign in to manage hospital operations & staff</p>
    </div>

    <!-- Server Error Alert -->
    @if (serverError) {
      <div class="mb-4 p-3 corner-radius-8 bg-error-subtle color-error body-sm flex items-center gap-2">
        <ui-icon name="alert-circle.svg" size="small"></ui-icon>
        <span>{{ serverError }}</span>
      </div>
    }

    <!-- Progressive Google OAuth Button -->
    <button
      type="button"
      (click)="onGoogleLogin()"
      class="google-btn w-full p-3 flex items-center justify-center gap-3 font-medium corner-radius-8 border transition-all mb-4"
    >
      <svg class="w-5 h-5" viewBox="0 0 24 24">
        <path
          fill="#4285F4"
          d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
        />
        <path
          fill="#34A853"
          d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
        />
        <path
          fill="#FBBC05"
          d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
        />
        <path
          fill="#EA4335"
          d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
        />
      </svg>
      <span>Continue with Google</span>
    </button>

    <div class="divider-container flex items-center gap-3 my-4">
      <div class="flex-1 h-px bg-border"></div>
      <span class="body-xs text-secondary uppercase font-semibold">OR</span>
      <div class="flex-1 h-px bg-border"></div>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <ui-input
        id="email"
        type="email"
        label="Email Address"
        placeholder="admin@hospital.com"
        formControlName="email"
        [errorMessage]="emailError"
      ></ui-input>

      <ui-input
        id="password"
        type="password"
        label="Password"
        placeholder="••••••••"
        formControlName="password"
        [errorMessage]="passwordError"
      ></ui-input>

      <div class="flex items-center justify-end my-1">
        <a href="javascript:void(0)" class="body-sm link-brand">Forgot Password?</a>
      </div>

      <button
        type="submit"
        class="p-button w-full p-3 flex items-center justify-center gap-2 font-semibold mt-2"
        [disabled]="isLoading"
      >
        @if (!isLoading) {
          <ui-icon name="check.svg" size="small"></ui-icon>
        }
        <span>{{ isLoading ? 'Signing in...' : 'Sign In' }}</span>
      </button>
    </form>

    <!-- Navigation Link to Register -->
    <div class="flex items-center justify-center mt-6 pt-4 border-t text-sm">
      <span class="text-secondary mr-2">Don't have an account?</span>
      <a routerLink="/auth/register" class="link-brand font-medium">Sign Up</a>
    </div>
  </div>
</div>
